name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Valeurs publiques (visibles dans le JavaScript du site) : variables, pas secrets
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_STRAVA_CLIENT_ID: ${{ vars.VITE_STRAVA_CLIENT_ID }}
          # Clé Météo-France : intégrée au JavaScript du site, donc visible. Acceptable pour un prototype (clé à courte durée de vie)
          VITE_METEOFRANCE_API_KEY: ${{ secrets.VITE_METEOFRANCE_API_KEY }}
          # Clé NASA FIRMS : même limite (visible dans le JavaScript). Lue dans les secrets, ou dans les variables du dépôt à défaut
          VITE_FIRMS_API_KEY: ${{ secrets.VITE_FIRMS_API_KEY || vars.VITE_FIRMS_API_KEY }}
          # PostHog : clé publique et hôte, visibles dans le JavaScript (acceptable, cf. CLAUDE.md)
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
